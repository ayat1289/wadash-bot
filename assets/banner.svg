<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06121a"/>
      <stop offset="0.55" stop-color="#0b2e3d"/>
      <stop offset="1" stop-color="#062b22"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff">
        <animate attributeName="stop-color" values="#00e5ff;#25d366;#00e5ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#25d366">
        <animate attributeName="stop-color" values="#25d366;#00e5ff;#25d366" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <g stroke="#00e5ff" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
  </g>
  <circle cx="1020" cy="110" r="110" fill="#00e5ff" fill-opacity="0.10">
    <animate attributeName="r" values="110;125;110" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1020" cy="110" r="70" fill="#25d366" fill-opacity="0.10">
    <animate attributeName="r" values="70;82;70" dur="5s" repeatCount="indefinite"/>
  </circle>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="4s" repeatCount="indefinite"/>
    <rect x="920" y="190" width="200" height="130" rx="28" fill="#0b1d26" stroke="#00e5ff" stroke-width="3"/>
    <line x1="1020" y1="190" x2="1020" y2="150" stroke="#00e5ff" stroke-width="4"/>
    <circle cx="1020" cy="140" r="14" fill="#00e5ff">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <g>
      <circle cx="980" cy="245" r="16" fill="#00e5ff"/>
      <circle cx="1060" cy="245" r="16" fill="#25d366"/>
      <animate attributeName="opacity" values="1;1;0.2;1;1" dur="4s" repeatCount="indefinite"/>
    </g>
    <rect x="970" y="282" width="100" height="12" rx="6" fill="#00e5ff" fill-opacity="0.8"/>
  </g>
  <rect x="0" y="0" width="1200" height="4" fill="#00e5ff" fill-opacity="0.6">
    <animate attributeName="y" values="0;416;0" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect x="60" y="60" width="760" height="300" rx="24" fill="#000000" fill-opacity="0.25" stroke="#00e5ff" stroke-opacity="0.35"/>
  <text x="100" y="150" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900" letter-spacing="4" fill="#ffffff">HEER-MD</text>
  <text x="100" y="205" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="url(#glow)">MULTI-DEVICE WHATSAPP BOT</text>
  <text x="100" y="250" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#c8eef5">Group control. Media downloads. Built in TypeScript.</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">
    <rect x="100" y="285" width="150" height="36" rx="18" fill="#00e5ff">
      <animate attributeName="opacity" values="1;0.75;1" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="175" y="308" text-anchor="middle" fill="#06121a">TYPESCRIPT</text>
    <rect x="265" y="285" width="120" height="36" rx="18" fill="#25d366"/>
    <text x="325" y="308" text-anchor="middle" fill="#06121a">BAILEYS</text>
    <rect x="400" y="285" width="110" height="36" rx="18" fill="#ffffff"/>
    <text x="455" y="308" text-anchor="middle" fill="#06121a">DOCKER</text>
  </g>
</svg>
